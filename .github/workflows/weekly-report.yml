name: Weekly SELAH Health Check

on:
  schedule:
    # 매주 월요일 오전 9시 KST (= UTC 00:00)
    - cron: '0 0 * * 1'
  workflow_dispatch: {}   # 수동 실행 허용

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run weekly report via Claude Code
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mode: agent
          direct_prompt: |
            오늘 날짜 기준으로 SELAH 저장소 주간 점검을 수행하고 리포트를 PR로 올려줘.

            절차:
            1. main 최신 상태 기준으로 새 브랜치 claude/weekly-report-<YYYY-MM-DD> 를 만든다. main에 직접 커밋하지 않는다.
            2. 다음 항목을 코드 직접 검토로 점검한다:
               - 서버 API (src/app/api/ 하위 모든 route.ts)
               - 인증·미들웨어 (src/lib/supabase/*, src/middleware.ts)
               - 데이터베이스 설정 (supabase/**/*.sql) — RLS 정책 포함
               - 서비스워커·PWA (public/sw.js, public/manifest.json)
               - 주요 라이브러리 (src/lib/*)
               - 배포·환경 설정 (README*.md, next.config.mjs, netlify.toml)
               점검 관점: 새 버그 · 미완성 · 개선점 · 보안 이슈
            3. 직전 주 리포트(reports/weekly-*.md)가 있으면 읽어서 지난주 대비 변화/해결/신규 항목을 구분한다.
            4. 결과를 reports/weekly-<YYYY-MM-DD>.md 에 저장한다.
               - 비개발자가 이해할 수 있는 쉬운 한국어로 작성
               - 각 항목: 무엇이 문제인지 / 왜 중요한지 / 무엇을 하면 되는지
               - 심각도: 🔴 긴급 / 🟠 높음 / 🟡 보통 / 🟢 낮음
               - 출시/운영 관점 우선순위 제안 (1순위/2순위/3순위)
            5. 리포트 파일만 커밋·푸시하고 PR을 생성한다. 코드는 절대 수정하지 않는다.
               PR 제목: docs: 주간 점검 리포트 추가 (<YYYY-MM-DD>)
